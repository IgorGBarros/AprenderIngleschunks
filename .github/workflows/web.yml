name: Web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes Python (inclui checar se o chunks.json está atualizado)
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.GITHUB_PAGES == 'true'
        with:
          path: web/dist

  # GitHub Pages é PÚBLICO: só publica se a variável GITHUB_PAGES for "true"
  # (Settings › Secrets and variables › Actions › Variables).
  deploy:
    if: github.ref == 'refs/heads/main' && vars.GITHUB_PAGES == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publica na sua VPS (privada). Ligue criando a variável VPS_HOST e o secret
  # VPS_SSH_KEY (passo a passo em deploy/README.md).
  vps:
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && vars.VPS_HOST != ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
        env:
          BASE_PATH: /
      - name: Enviar para a VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: ${{ vars.VPS_USER || 'ubuntu' }}@${{ vars.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          rsync -az --delete -e "ssh -i ~/.ssh/vps -o StrictHostKeyChecking=accept-new" \
            web/dist/ "$TARGET:/var/www/chunks/"
